name: Update Manifests Individually

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_updates: ${{ steps.set-matrix.outputs.has_updates }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Check which manifests need update
      id: set-matrix
      run: |
        import json
        import re
        import os
        import sys
        from pathlib import Path

        # 强制刷新输出，确保日志实时显示
        def log(msg):
            print(msg, flush=True)

        log("--- 🚀 Debug Start ---")
        log(f"Current Working Directory: {os.getcwd()}")

        manifests_dir = Path('apps/bucket')
        log(f"Checking Path: {manifests_dir.absolute()}")

        # 检查目录是否存在
        if not manifests_dir.exists():
            log(f"❌ ERROR: Directory '{manifests_dir}' does not exist!")
            # 列出当前目录下的文件，帮你找找路径
            log(f"Root contents: {os.listdir('.')}")
        else:
            log(f"✅ Directory found.")

        # 获取文件列表
        all_files = list(manifests_dir.glob('*.json'))
        log(f"Found {len(all_files)} .json files.")

        needs_update = []

        for json_file in all_files:
            log(f"🔍 Processing: {json_file.name}")
            try:
                with open(json_file, 'r', encoding='utf-8') as f:
                    manifest = json.load(f)
                
                if 'checkver' not in manifest:
                    log(f"  - Skip: No 'checkver' key")
                    continue

                checkver_url = manifest['checkver']['url']
                regex_pattern = manifest['checkver']['regex']
                
                # 尝试导入 requests
                try:
                    import requests
                except ImportError:
                    log("  - ❌ ERROR: 'requests' module not found. Please add 'pip install requests' step.")
                    break # 没库就不用继续了

                response = requests.get(checkver_url, timeout=30)
                log(f"  - Request status: {response.status_code}")
                
                match = re.search(regex_pattern, response.text)
                if match:
                    new_version = match.group(1)
                    current_version = manifest.get('version')
                    log(f"  - Local: {current_version}, Remote: {new_version}")
                    
                    if str(new_version) != str(current_version):
                        needs_update.append({
                            'file': json_file.name,
                            'current_version': current_version,
                            'new_version': new_version
                        })
                else:
                    log(f"  - ⚠️ Regex mismatch")

            except Exception as e:
                log(f"  - ❌ Exception for {json_file.name}: {str(e)}")

        # 写入输出
        matrix_data = {'include': needs_update}
        matrix_json = json.dumps(matrix_data)

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"matrix={matrix_json}\n")
            has_updates = 'true' if needs_update else 'false'
            f.write(f"has_updates={has_updates}\n")

        log(f"--- ✅ Debug End. Found updates: {len(needs_update)} ---")
        
      shell: python
    
    - name: Log update summary
      run: |
        echo "Update matrix result: ${{ steps.set-matrix.outputs.matrix }}"

  update-single:
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.check-updates.outputs.matrix) }}
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Update ${{ matrix.file }}
      id: update
      run: |
        import json
        import re
        import hashlib
        import requests
        import os
        from pathlib import Path
        
        manifest_path = Path('apps/bucket') / '${{ matrix.file }}'
        
        with open(manifest_path, 'r', encoding='utf-8') as f:
            manifest = json.load(f)
        
        new_version = '${{ matrix.new_version }}'
        
        # 更新所有架构
        architectures = manifest['architecture'].keys()
        for arch in architectures:
            if arch not in manifest['autoupdate']['architecture']:
                continue
            
            url_template = manifest['autoupdate']['architecture'][arch]['url']
            download_url = url_template.replace('$version', new_version)
            
            print(f"Downloading {arch} from: {download_url}")
            file_response = requests.get(download_url, timeout=60, stream=True)
            file_response.raise_for_status()
            
            temp_file = f"/tmp/{Path(manifest_path).stem}_{arch}_{new_version}.exe"
            with open(temp_file, 'wb') as f:
                for chunk in file_response.iter_content(chunk_size=8192):
                    f.write(chunk)
            
            sha256_hash = hashlib.sha256()
            with open(temp_file, 'rb') as f:
                for byte_block in iter(lambda: f.read(4096), b""):
                    sha256_hash.update(byte_block)
            
            file_hash = sha256_hash.hexdigest()
            manifest['architecture'][arch]['url'] = download_url
            manifest['architecture'][arch]['hash'] = file_hash
            
            os.remove(temp_file)
        
        manifest['version'] = new_version
        
        with open(manifest_path, 'w', encoding='utf-8') as f:
            json.dump(manifest, f, indent=4, ensure_ascii=False)
        
        print(f"✓ Updated to version {new_version}")
        
      shell: python
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: |
          chore(${{ matrix.file }}): update to version ${{ matrix.new_version }}
        title: "chore(${{ matrix.file }}): update to ${{ matrix.new_version }}"
        body: |
          ## 更新 ${{ matrix.file }}
          
          - **当前版本**: ${{ matrix.current_version }}
          - **最新版本**: ${{ matrix.new_version }}
          
          ### 变更内容
          - ✅ 版本号已更新
          - ✅ 下载链接已更新
          - ✅ SHA256 哈希已验证
          
          > 此 PR 由 GitHub Actions 自动创建
          
        branch: update-${{ matrix.file }}-${{ matrix.new_version }}
        base: main
        labels: |
          automated pr
          ${{ matrix.file }}
        delete-branch: true