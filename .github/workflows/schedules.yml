name: Update Manifests Individually

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Check which manifests need update
      id: set-matrix
      run: |
        import json
        import re
        import os
        from pathlib import Path
        
        manifests_dir = Path('apps/bucket')
        needs_update = []
        
        for json_file in manifests_dir.glob('*.json'):
            with open(json_file, 'r', encoding='utf-8') as f:
                manifest = json.load(f)
            
            if 'checkver' not in manifest:
                continue
            
            # 检查是否有新版本（这里只检测，不下载）
            checkver_url = manifest['checkver']['url']
            regex_pattern = manifest['checkver']['regex']
            
            try:
                import requests
                response = requests.get(checkver_url, timeout=30)
                response.raise_for_status()
                
                match = re.search(regex_pattern, response.text)
                if match:
                    new_version = match.group(1)
                    current_version = manifest.get('version')
                    
                    if new_version != current_version:
                        needs_update.append({
                            'file': json_file.name,
                            'current_version': current_version,
                            'new_version': new_version
                        })
            except Exception as e:
                print(f"Error checking {json_file.name}: {e}")
        
        # 创建矩阵
        matrix = {'include': needs_update}
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"matrix={json.dumps(matrix)}\n")
        
      shell: python
    
    - name: Log update summary
      run: |
        echo "Update matrix result: ${{ steps.set-matrix.outputs.matrix }}"

  update-single:
    needs: check-updates
    if: ${{ fromJson(needs.check-updates.outputs.matrix).include != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.check-updates.outputs.matrix) }}
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Update ${{ matrix.file }}
      id: update
      run: |
        import json
        import re
        import hashlib
        import requests
        import os
        from pathlib import Path
        
        manifest_path = Path('apps/bucket') / '${{ matrix.file }}'
        
        with open(manifest_path, 'r', encoding='utf-8') as f:
            manifest = json.load(f)
        
        new_version = '${{ matrix.new_version }}'
        
        # 更新所有架构
        architectures = manifest['architecture'].keys()
        for arch in architectures:
            if arch not in manifest['autoupdate']['architecture']:
                continue
            
            url_template = manifest['autoupdate']['architecture'][arch]['url']
            download_url = url_template.replace('$version', new_version)
            
            print(f"Downloading {arch} from: {download_url}")
            file_response = requests.get(download_url, timeout=60, stream=True)
            file_response.raise_for_status()
            
            temp_file = f"/tmp/{Path(manifest_path).stem}_{arch}_{new_version}.exe"
            with open(temp_file, 'wb') as f:
                for chunk in file_response.iter_content(chunk_size=8192):
                    f.write(chunk)
            
            sha256_hash = hashlib.sha256()
            with open(temp_file, 'rb') as f:
                for byte_block in iter(lambda: f.read(4096), b""):
                    sha256_hash.update(byte_block)
            
            file_hash = sha256_hash.hexdigest()
            manifest['architecture'][arch]['url'] = download_url
            manifest['architecture'][arch]['hash'] = file_hash
            
            os.remove(temp_file)
        
        manifest['version'] = new_version
        
        with open(manifest_path, 'w', encoding='utf-8') as f:
            json.dump(manifest, f, indent=4, ensure_ascii=False)
        
        print(f"✓ Updated to version {new_version}")
        
      shell: python
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: |
          chore(${{ matrix.file }}): update to version ${{ matrix.new_version }}
        title: "chore(${{ matrix.file }}): update to ${{ matrix.new_version }}"
        body: |
          ## 更新 ${{ matrix.file }}
          
          - **当前版本**: ${{ matrix.current_version }}
          - **最新版本**: ${{ matrix.new_version }}
          
          ### 变更内容
          - ✅ 版本号已更新
          - ✅ 下载链接已更新
          - ✅ SHA256 哈希已验证
          
          > 此 PR 由 GitHub Actions 自动创建
          
        branch: update-${{ matrix.file }}-${{ matrix.new_version }}
        base: main
        labels: |
          automated pr
          ${{ matrix.file }}
        delete-branch: true