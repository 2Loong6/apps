name: Update Manifests Individually

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_updates: ${{ steps.set-matrix.outputs.has_updates }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Check which manifests need update
      id: set-matrix
      shell: python
      run: |
        import json
        import re
        import os
        import requests
        from pathlib import Path

        # --- 这里的路径根据你的日志改为 'bucket' ---
        manifests_dir = Path('bucket') 
        
        needs_update = []
        headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}

        if not manifests_dir.exists():
            print(f"❌ Error: Directory '{manifests_dir.absolute()}' not found!")
            print(f"Current directory contains: {os.listdir('.')}")
            exit(1)

        for json_file in manifests_dir.glob('*.json'):
            print(f"🔍 Checking {json_file.name}...")
            try:
                with open(json_file, 'r', encoding='utf-8') as f:
                    manifest = json.load(f)

                if 'checkver' not in manifest:
                    continue

                checkver_url = manifest['checkver']['url']
                regex_pattern = manifest['checkver']['regex']

                response = requests.get(checkver_url, headers=headers, timeout=30)
                response.raise_for_status()

                match = re.search(regex_pattern, response.text)
                if match:
                    new_version = match.group(1)
                    current_version = manifest.get('version')
                    if str(new_version) != str(current_version):
                        print(f"  ✨ New version found: {new_version}")
                        needs_update.append({
                            'file': json_file.name,
                            'current_version': current_version,
                            'new_version': new_version
                        })
            except Exception as e:
                print(f"  ❌ Error: {e}")

        # 输出结果
        matrix_data = {'include': needs_update}
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"matrix={json.dumps(matrix_data)}\n")
            f.write(f"has_updates={'true' if needs_update else 'false'}\n")
        
        print(f"\n✅ Done. Found {len(needs_update)} updates.")

    - name: Log update summary
      run: |
        echo "Update matrix result: ${{ steps.set-matrix.outputs.matrix }}"

  update-single:
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.check-updates.outputs.matrix) }}
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Update ${{ matrix.file }}
      id: update
      run: |
        import json
        import hashlib
        import subprocess
        import os
        import tempfile
        from pathlib import Path
        
        manifest_path = Path('bucket') / '${{ matrix.file }}'
        
        with open(manifest_path, 'r', encoding='utf-8') as f:
            manifest = json.load(f)
        
        new_version = '${{ matrix.new_version }}'
        
        architectures = manifest['architecture'].keys()
        for arch in architectures:
            if arch not in manifest['autoupdate']['architecture']:
                continue
            
            url_template = manifest['autoupdate']['architecture'][arch]['url']
            download_url = url_template.replace('$version', new_version)
            
            print(f"🚀 Downloading {arch} via optimized curl: {download_url}")
            
            # 使用 tempfile 确保跨平台兼容 (Linux /tmp, Windows TEMP)
            temp_dir = tempfile.gettempdir()
            temp_file = os.path.join(temp_dir, f"{Path(manifest_path).stem}_{arch}_{new_version}.exe")
            
            # 完整平移你测试成功的 curl 参数
            curl_command = [
                "curl", "-L", "-k",
                "--compressed",
                "--retry", "3",
                "--http2",
                "-H", "Host: dl.todesk.com",
                "-H", "Connection: keep-alive",
                "-H", "Upgrade-Insecure-Requests: 1",
                "-H", "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                "-H", "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7",
                "-H", "Sec-Fetch-Site: cross-site",
                "-H", "Sec-Fetch-Mode: navigate",
                "-H", "Sec-Fetch-Dest: document",
                "-H", "Referer: https://www.todesk.com/",
                "-H", "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8",
                "-o", temp_file,
                download_url
            ]
            
            try:
                # 使用 check=True，如果 curl 返回非零状态码将抛出异常
                subprocess.run(curl_command, check=True, capture_output=True, text=True)
                
                # 双重校验：文件是否存在以及大小是否正常 (ToDesk exe 通常 > 50MB)
                if not os.path.exists(temp_file) or os.path.getsize(temp_file) < 100 * 1024:
                    print(f"❌ {arch} 下载文件过小或不存在，可能触发了挑战页")
                    if os.path.exists(temp_file): os.remove(temp_file)
                    continue

                # 计算 SHA256
                sha256_hash = hashlib.sha256()
                with open(temp_file, 'rb') as f:
                    for byte_block in iter(lambda: f.read(65536), b""): # 增大 buffer 提高计算速度
                        sha256_hash.update(byte_block)
                
                file_hash = sha256_hash.hexdigest()
                manifest['architecture'][arch]['url'] = download_url
                manifest['architecture'][arch]['hash'] = file_hash
                print(f"✅ {arch} updated. Hash: {file_hash[:10]}...")
                
            except subprocess.CalledProcessError as e:
                print(f"❌ Curl failed for {arch}: {e.stderr}")
            finally:
                if os.path.exists(temp_file):
                    os.remove(temp_file)
        
        manifest['version'] = new_version
        with open(manifest_path, 'w', encoding='utf-8') as f:
            json.dump(manifest, f, indent=4, ensure_ascii=False)
        
        print(f"✨ Manifest updated to version {new_version}")
      shell: python
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: |
          chore(${{ matrix.file }}): update to version ${{ matrix.new_version }}
        title: "chore(${{ matrix.file }}): update to ${{ matrix.new_version }}"
        body: |
          ## 更新 ${{ matrix.file }}
          
          - **当前版本**: ${{ matrix.current_version }}
          - **最新版本**: ${{ matrix.new_version }}
          
          ### 变更内容
          - ✅ 版本号已更新
          - ✅ 下载链接已更新
          - ✅ SHA256 哈希已验证
          
          > 此 PR 由 GitHub Actions 自动创建
          
        branch: update-${{ matrix.file }}-${{ matrix.new_version }}
        base: main
        labels: |
          automated pr
          ${{ matrix.file }}
        delete-branch: true
